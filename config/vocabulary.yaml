# The frozen category schemes the derived vocabulary assigns against
# (issue #806, derived-vocabulary slice 02). This file is CONFIGURATION a
# person commits, not an artifact a command derives. Nothing in it is
# inferred at run time, and `axial vocabulary build` never writes it.
#
# Why frozen: `axial vocabulary examine` (issue #805) measured the same
# prompt under the same model producing different granularity between runs
# -- `position` 5 categories then 15, `stops_holding` 7 then 20, `mechanism`
# 36 then 20. A vocabulary that reshuffles on every build is not an index,
# and reconciling one build's categories against the next one's is name
# merging wearing a new coat. So a scheme is proposed once, read by a
# person, and committed here. Which columns are worth committing at all is
# the founder's read of #805's report, never a rule in code.
#
# The shape is a TREE, not a list (founder ruling, 2026-08-28). A category
# may carry `children`, and a child is a finer category under its parent.
# The committed v1 scheme below is depth 1 -- every category is a root and
# its parent id is null -- but the file's shape does not assume that, so a
# second level is an edit here plus a version bump, never a migration.
#
# `version` is per column and covers that column's WHOLE tree, every level
# of it. Editing a category, adding one, or adding a level is a version
# bump. `axial vocabulary build` refuses to mix two schemes in one
# artifact: an existing artifact built under a different version is named,
# not silently overwritten and not silently extended.
#
# `id` is what the artifact and every downstream join record. It never
# changes meaning under a note already filed against it -- rename the
# `name`, rewrite the `gloss`, but a changed `id` is a new category.
# `name` and `gloss` are what the model reads when it assigns.

columns:
  mechanism:
    # Proposed by the examine pass over a random 400-value sample of the
    # column, 2026-08-27 (data/logs/2026-08-27-vocabulary-categorise-v2/).
    # 88.5% of a disjoint 400 the model had never seen fell into these 20;
    # every category reaching 5 members drew on more than one book, and the
    # largest held 8.0% of the held-out sample. The names below are the
    # founder-side read of that run: it persisted all twenty `name` fields
    # as the identical string "Causal mechanism", with the discriminating
    # label sitting as the clause before the first colon of each gloss.
    version: "2026-08-28-mechanism-v1"
    categories:
      - id: state-repression-and-violence
        name: "state repression and violence"
        gloss: >-
          Answers describe how state forces use coercion, violence, or
          intimidation to suppress opposition, enforce control, or generate
          compliance, often through military, police, or paramilitary means.
      - id: economic-dependency-and-structural-adjustment
        name: "economic dependency and structural adjustment"
        gloss: >-
          Answers explain how economic pressures (debt, IMF conditions, oil
          revenues, neoliberal reforms) reshape state-society relations, class
          structures, or political outcomes.
      - id: war-and-state-formation
        name: "war and state formation"
        gloss: >-
          Answers trace how warfare, military mobilization, or geopolitical
          competition drives state-building, territorial control, fiscal
          extraction, or institutional change.
      - id: ideological-persuasion-and-legitimation
        name: "ideological persuasion and legitimation"
        gloss: >-
          Answers show how beliefs, symbols, propaganda, or nationalist
          narratives are deployed to secure consent, mobilize support, or
          justify authority.
      - id: institutional-path-dependence-and-state-capacity
        name: "institutional path dependence and state capacity"
        gloss: >-
          Answers describe how existing institutions, bureaucracies, or legal
          frameworks constrain or enable subsequent actions, reforms, or
          outcomes.
      - id: elite-competition-and-coalition-formation
        name: "elite competition and coalition formation"
        gloss: >-
          Answers explain how rival elites negotiate, ally, or clash over
          power, resources, or authority, shaping political regimes or
          outcomes.
      - id: social-mobilization-and-collective-action
        name: "social mobilization and collective action"
        gloss: >-
          Answers detail how groups (classes, ethnicities, communities)
          organize, protest, or revolt in response to grievances,
          opportunities, or structural changes.
      - id: modernization-and-cultural-change
        name: "modernization and cultural change"
        gloss: >-
          Answers link industrialization, urbanization, education, or media to
          shifts in identity, values, or social organization.
      - id: territorial-control-and-conflict-dynamics
        name: "territorial control and conflict dynamics"
        gloss: >-
          Answers explain how spatial control, boundaries, or territorial
          shifts influence violence, collaboration, or political behavior
          during civil wars or insurgencies.
      - id: international-norms-and-external-intervention
        name: "international norms and external intervention"
        gloss: >-
          Answers show how global rules, foreign aid, or great-power actions
          shape domestic sovereignty, state survival, or political
          trajectories.
      - id: resource-extraction-and-rentier-state
        name: "resource extraction and rentier state"
        gloss: >-
          Answers describe how natural resource rents (oil, minerals) or
          external funds enable state autonomy, patronage, or authoritarian
          rule without domestic taxation.
      - id: organizational-logics-and-bureaucratic-rationality
        name: "organizational logics and bureaucratic rationality"
        gloss: >-
          Answers explain how organizational structures (hierarchies,
          networks, party cells) produce discipline, loyalty, or violence
          through routine procedures.
      - id: demographic-and-ecological-pressures
        name: "demographic and ecological pressures"
        gloss: >-
          Answers link population growth, land scarcity, or geographical
          factors to migration, conflict, or institutional adaptation.
      - id: micro-interaction-and-symbolic-reciprocity
        name: "micro-interaction and symbolic reciprocity"
        gloss: >-
          Answers detail how face-to-face exchanges, gestures, or rituals
          trigger escalation, solidarity, or identity formation.
      - id: learning-adaptation-and-innovation
        name: "learning, adaptation, and innovation"
        gloss: >-
          Answers show how actors copy, borrow, or improve upon existing
          models (technologies, institutions, ideologies) from other contexts.
      - id: feedback-loops-and-unintended-consequences
        name: "feedback loops and unintended consequences"
        gloss: >-
          Answers describe how initial actions produce reactions that alter
          the original context, often leading to self-reinforcing or self-
          undermining dynamics.
      - id: identity-construction-and-boundary-making
        name: "identity construction and boundary-making"
        gloss: >-
          Answers explain how ethnic, national, or religious categories are
          created, politicized, or naturalized through social practices and
          discourse.
      - id: market-penetration-and-commodification
        name: "market penetration and commodification"
        gloss: >-
          Answers show how capitalist markets, trade, or commercialization
          reshape social relations, property rights, or labor practices.
      - id: legal-and-normative-frameworks
        name: "legal and normative frameworks"
        gloss: >-
          Answers describe how laws, constitutions, or international legal
          principles constrain or enable actors, producing specific political
          or social outcomes.
      - id: technological-change-and-infrastructure
        name: "technological change and infrastructure"
        gloss: >-
          Answers link inventions (military, agricultural, communication) to
          shifts in power, economy, or social organization.

  claim:
    # Proposed by the examine pass over a random 400-value sample of the
    # column, 2026-08-27 (data/logs/2026-08-27-vocabulary-categorise-v2/
    # console-claim.log): 10 categories, 99.5% of a disjoint 400 the model
    # had never seen fell into them, largest category 21.2%, two-model
    # agreement 77.0% on a 100-value subsample of that 400.
    #
    # Those three figures were measured on the ten-category DRAFT, before
    # the founder's edit below. The nine committed here have never been
    # scored on held-out data. The edit folded one category of 398 into
    # another, so the difference should be small, but it was not measured
    # and nothing here should be read as if it had been.
    #
    # The founder approved this scheme 2026-08-28 with one edit: the
    # drafted tenth category, "Acknowledgment or credit statement" (1
    # member, 1 source on the held-out sample), sits below the 5-member
    # bar the run itself uses to call a category real rather than noise.
    # It is folded into the bibliographic/formal-description category
    # below rather than deleted outright -- deleting it would leave the
    # assigning model nowhere to put an acknowledgment and it would answer
    # with a refusal instead, which is a worse outcome than one category
    # covering two related things. That category's gloss carries the
    # folded-in clause below; the other eight glosses are the drafting
    # run's own words, verbatim.
    #
    # One property of this axis a reader should know before using it: it
    # mixes kind-of-claim categories (empirical finding, critique,
    # methodological preconditions, comparative/typological
    # classification, characterization) with three topical ones (state
    # formation, violence/conflict, nationalism/identity). An answer
    # arguing causally about state formation satisfies both readings, and
    # the assigning model picks one. That was committed deliberately
    # rather than tidied up, because the mixture is measurable and was not
    # worth guessing at.
    version: "2026-08-28-claim-v1"
    categories:
      - id: causal-argument-state-formation-or-power
        name: "causal argument about state formation or state power"
        gloss: >-
          Answers that propose a driver or mechanism for the construction,
          strengthening, or transformation of state structures, including
          fiscal-military extraction, war, ideology, or institutional
          change.
      - id: empirical-finding-without-causal-claim
        name: "empirical finding or observation without causal claim"
        gloss: >-
          Answers that report what happened, what a source says, or what a
          dataset shows, without arguing why it happened or what it
          implies for theory.
      - id: characterization-of-regime-movement-or-system
        name: "characterization of a regime, movement, or political system"
        gloss: >-
          Answers that describe the nature, strategy, or social base of a
          state, party, or armed group, without advancing a causal
          argument about its origins or effects.
      - id: causal-argument-violence-war-or-conflict
        name: "causal argument about violence, war, or conflict dynamics"
        gloss: >-
          Answers that explain why violence occurs, how it is organized, or
          what shapes its patterns, including micro-level mechanisms, elite
          strategies, and structural conditions.
      - id: critique-of-existing-theories-or-concepts
        name: "critique of existing theories or concepts"
        gloss: >-
          Answers that identify errors, omissions, or biases in a specific
          scholar's framework, school of thought, or received category,
          rather than proposing an alternative explanation.
      - id: bibliographic-source-note-or-formal-description
        name: "bibliographic, source note, or formal description of the text itself"
        gloss: >-
          Answers that list references, describe the book's structure, or
          state that the passage makes no substantive claim, as opposed to
          advancing an argument. Acknowledgments and credit statements --
          thanking individuals or institutions, or noting intellectual
          debts -- belong here too.
      - id: causal-argument-nationalism-or-identity
        name: "causal argument about nationalism, identity, or nation-building"
        gloss: >-
          Answers that explain the emergence, content, or political
          salience of national or ethnic identities and nationalist
          movements, as distinct from documenting their expressions.
      - id: methodological-preconditions
        name: "methodological preconditions"
        gloss: >-
          Answers that specify how research should be designed, what
          analytical steps are required, or what conditions must hold for
          valid causal inference, as distinct from answers that report
          empirical findings or historical narratives.
      - id: comparative-or-typological-classification
        name: "comparative or typological classification"
        gloss: >-
          Answers that sort cases, actors, or phenomena into categories or
          ideal types, or that contrast cases to highlight differences in
          kind.

  position:
    # Proposed by the examine pass over a random 400-value sample of the
    # column, 2026-08-29 (data/logs/2026-08-29-position-vocabulary/
    # console-examine.log), and built for issue #838: this axis is the one
    # HELD OUT of the grouping in #831, so purity measured on it -- not on
    # the axis the grouping was built from -- is what decides whether that
    # rebuild worked. 9 categories, 93.0% assignment on a disjoint held-out
    # 400, largest category 16.2% of that sample, all 9 categories reaching
    # 5+ members and spanning 2+ sources, two-model agreement 70.0% overall
    # and 73.8% where the first model assigned a category (n=84).
    #
    # Granularity is unstable on this column: the same prompt and model
    # returned 5 categories on one run and 15 on another, 2026-08-27
    # (data/logs/2026-08-27-vocabulary-categorise-v2/summary.md, line 78),
    # and 9 on this run. The nine below are one draw from that instability,
    # not a settled taxonomy -- read counts built against this scheme with
    # that in mind, and treat a later edit as a version bump that re-asks
    # the column under `--force`, same as any other scheme change.
    #
    # Committed verbatim from the examine pass's proposal, names lowered to
    # match this file's convention; the gloss wording, including its em
    # dashes, is the model's.
    version: "2026-08-29-position-v1"
    categories:
      - id: causal-claims-about-war-and-violence
        name: "causal claims about war and violence"
        gloss: >-
          Answers that assert causes, drivers, or explanations for war,
          rebellion, civil violence, or military conflict—whether through
          structural factors, leadership, social networks, or information.
      - id: characterizations-of-nationalism-and-nationhood
        name: "characterizations of nationalism and nationhood"
        gloss: >-
          Answers that describe the nature, origins, or functions of
          nationalism, national identity, or nation-states as constructed,
          contingent, or ideological phenomena.
      - id: descriptions-of-state-formation-and-state-power
        name: "descriptions of state formation and state power"
        gloss: >-
          Answers that account for how states arise, develop, or exercise
          power—including coercion, bureaucracy, legitimacy, and relations
          with society—without focusing on a single country.
      - id: accounts-of-social-and-economic-transformation
        name: "accounts of social and economic transformation"
        gloss: >-
          Answers that explain changes in class structure, economic
          systems, welfare, or development—such as industrialization,
          liberalization, or agrarian change—as processes with specific
          drivers.
      - id: analyses-of-political-regimes-and-authoritarianism
        name: "analyses of political regimes and authoritarianism"
        gloss: >-
          Answers that characterize regime types, authoritarian strategies,
          or political control—including co-optation, repression, and the
          role of parties or militaries—without reducing to single-country
          narratives.
      - id: evaluations-of-historiographic-or-theoretical-positions
        name: "evaluations of historiographic or theoretical positions"
        gloss: >-
          Answers that assess, critique, or refine a specific scholar's
          argument, a theoretical model, or a methodological
          approach—rather than stating an empirical claim.
      - id: claims-about-identity-construction-and-ethnicity
        name: "claims about identity construction and ethnicity"
        gloss: >-
          Answers that argue identities (ethnic, sectarian,
          minority/majority) are politically constructed,
          context-dependent, or mobilized rather than fixed or primordial.
      - id: descriptions-of-international-and-legal-order
        name: "descriptions of international and legal order"
        gloss: >-
          Answers that characterize sovereignty, recognition, international
          norms, intervention, or the structure of the international
          system—often as historically contingent or contested.
      - id: non-substantive-or-bibliographic-statements
        name: "non-substantive or bibliographic statements"
        gloss: >-
          Answers that do not assert a position but only provide
          acknowledgments, references, or notes about sources,
          methodology, or institutions—often explicitly labeled as not in
          the passage.

  relation:
    # PROPOSED 2026-09-29 from `axial vocabulary examine --column relation`
    # (data/logs/2026-09-29-855-relation-examine/), awaiting the founder's
    # edit and commit (issue #855, DEC-75 (3)).
    #
    # This column is the argument map's relations
    # (`data/map/<pin>/relations.jsonl`): one free-text label and one `says`
    # sentence per relation between two positions. An assignment is keyed by
    # (from_position_id, to_position_id, relation) and written beside the
    # free label, never over it.
    #
    # Flat, one level: `axial vocabulary build` assigns depth 1 only (#806).
    # The examine pass proposed 17 kinds; the 14 that drew members are folded
    # into the 9 below (held-out counts of 391 assigned, 9 refused, of 400).
    # The AIF genus each kind belongs to is named in its gloss. AIF's third
    # genus, preference, drew nothing and is left out.
    #
    # `axial map ask` reads the `conflict` id by name to put conflicting
    # positions first in the corridor, so keep that id. A flat scheme offers
    # no example labels to the relate prompt: `relation_kind_examples` offers
    # only kinds below the top level, so the map build's prompt is unchanged.
    version: "2026-09-29-relation-v1"
    categories:
      - id: conflict
        name: "conflict"
        gloss: >-
          One argument cannot be held together with the other: it denies its
          claim, shows by a counterexample that it cannot hold as stated, or
          offers a rival primary cause for the same outcome. AIF conflict.
          (contradiction 38, counterexample 6, competing explanation 4)
      - id: qualification
        name: "qualification"
        gloss: >-
          One argument keeps the other but limits it: narrows where it holds,
          adds a condition, or names a gap or oversimplification in it without
          rejecting it. Sits between AIF conflict and inference; it attacks
          scope, not the claim. (qualification 55, critique of limitation 4)
      - id: support
        name: "support"
        gloss: >-
          One argument gives evidence for, confirms, or agrees with the
          other's claim. AIF inference. (support 73)
      - id: illustration
        name: "illustration"
        gloss: >-
          One argument supplies a concrete case or instance of the other's
          general claim or definition. AIF inference. (74)
      - id: specification
        name: "specification"
        gloss: >-
          One argument makes the other's general claim more precise by naming
          its concrete factors, types, or details. AIF inference. (29)
      - id: mechanism
        name: "mechanism"
        gloss: >-
          One argument describes the causal process or pathway that produces
          the pattern or outcome the other reports. AIF inference. (40)
      - id: additional-cause
        name: "additional cause"
        gloss: >-
          One argument adds a cause, condition, or earlier event that the
          other's causal account needs or leaves out, without replacing it.
          AIF inference. (causal supplementation 36, antecedent 2)
      - id: grounding
        name: "grounding"
        gloss: >-
          One argument supplies the general principle or conceptual groundwork
          the other's specific claim rests on. AIF inference. (16)
      - id: extension
        name: "extension or context"
        gloss: >-
          One argument carries the other's claim to new cases, periods, or
          levels, or sets it in a wider historical or analytical frame.
          AIF inference. (scope extension 6, contextualization 8)

  about:
    # Committed for issue #857 (DEC-75 step 4) from #805's corrected examine
    # run, 2026-08-27 (data/logs/2026-08-27-vocabulary-categorise-v2/,
    # run.jsonl and summary.md line 38): 10 categories, 98.0% assignment on a
    # disjoint held-out 400, largest category 19.8%, all 10 reaching 5+
    # members across 2+ sources, two-model agreement 81.9% where assigned
    # (n=94). `about` is list-valued: each entry of a note's list is
    # assigned on its own.
    #
    # Committed verbatim from the proposal, names lowered to match this
    # file's convention. The retrieval filter, address and coverage
    # disclosure this column serves are its only uses; it is never the
    # map's bagging rule (DEC-74).
    #
    # `close_match` cross-maps a category to ELSST version 7 (CESSDA,
    # CC-BY-SA, https://thesauri.cessda.eu/elsst-7/) and is exported as
    # skos:closeMatch by `axial vocabulary export`. Nothing in the pipeline
    # reads it. Three categories have no close ELSST concept and carry none:
    # state formation (ELSST has no STATE or STATE FORMATION concept), social
    # categories (split across ETHNIC GROUPS, SOCIAL STRATIFICATION and
    # IDENTITY), and bibliographic references (not a subject).
    version: "2026-09-29-about-v1"
    categories:
      - id: state-formation-and-transformation
        name: "state formation and transformation"
        gloss: >-
          Answers about the origins, development, consolidation,
          and transformation of states, including nation-states,
          empires, and unrecognized states, as well as the shift
          between them.
      - id: nationalism-and-national-identity
        name: "nationalism and national identity"
        gloss: >-
          Answers about the origins, nature, expression, and
          consequences of nationalism, national identity, and
          national belonging, including banal/hot nationalism and
          ethnic vs. civic forms.
        # ELSST: NATIONALISM
        close_match: "https://elsst.cessda.eu/id/7/9389ee32-51c7-4eb6-8b4f-cc661ed4c027"
      - id: violence-war-and-conflict
        name: "violence, war, and conflict"
        gloss: >-
          Answers about the causes, conduct, dynamics, and
          consequences of organized violence, war, civil war, and
          collective violence, including motivations,
          psychological aspects, and logics.
        # ELSST: WAR
        close_match: "https://elsst.cessda.eu/id/7/61b5e15a-e082-4efc-87c4-7238a729bb58"
      - id: political-economy-and-development
        name: "political economy and development"
        gloss: >-
          Answers about economic systems, reforms, state
          allocation, class relations, welfare, taxation, and the
          intersection of economic and political power.
        # ELSST: ECONOMICS (alt. label POLITICAL ECONOMY)
        close_match: "https://elsst.cessda.eu/id/7/fc09ab8a-c74e-41b7-83ca-c5af01921a64"
      - id: colonialism-and-decolonization
        name: "colonialism and decolonization"
        gloss: >-
          Answers about colonial governance, its legacies, and
          processes of decolonization, including resistance,
          administrative practices, and post-colonial transitions.
        # ELSST: COLONIALISM
        close_match: "https://elsst.cessda.eu/id/7/0289b6ce-d389-43a8-96e2-248f8543cd93"
      - id: social-categories-and-identities
        name: "social categories and identities"
        gloss: >-
          Answers about the politicization, construction, and
          transformation of social categories such as ethnicity,
          race, religion, caste, and class, and their role in
          conflict or politics.
      - id: power-authority-and-governance
        name: "power, authority, and governance"
        gloss: >-
          Answers about the nature, sources, distribution, and
          exercise of power, including sovereignty, state
          capacity, bureaucratic autonomy, and types of authority.
        # ELSST: POLITICAL POWER
        close_match: "https://elsst.cessda.eu/id/7/7dbdef84-fc4c-4310-a89e-5927cfafd414"
      - id: social-movements-and-collective-action
        name: "social movements and collective action"
        gloss: >-
          Answers about the mobilization, organization, and
          dynamics of protest, revolutions, labor movements, and
          other forms of collective action.
        # ELSST: POLITICAL MOVEMENTS
        close_match: "https://elsst.cessda.eu/id/7/6c2edd13-ee22-4acc-8262-def2750e28c0"
      - id: theory-and-methodology
        name: "theory and methodology"
        gloss: >-
          Answers that discuss theoretical approaches, conceptual
          definitions, critiques of specific theories, or
          methodological issues in studying social and political
          phenomena.
        # ELSST: RESEARCH METHODOLOGY
        close_match: "https://elsst.cessda.eu/id/7/b949de54-22e5-40cc-a9bd-efe1148d4ee4"
      - id: bibliographic-and-source-references
        name: "bibliographic and source references"
        gloss: >-
          Answers that are lists of citations, sources, primary
          documents, or acknowledgements, rather than analytical
          content.

  move:
    # Committed for issue #857 (DEC-75 step 4) from #805's corrected examine
    # run, 2026-08-27 (data/logs/2026-08-27-vocabulary-categorise-v2/,
    # run.jsonl and summary.md line 39): 13 categories, 97.5% assignment on a
    # disjoint held-out 400, largest category 15.2%, all 13 reaching 5+
    # members across 2+ sources, two-model agreement 72.0% (n=100).
    #
    # Committed verbatim from the proposal, names lowered to match this
    # file's convention. The last category, role annotation, is answers that
    # echo a role label instead of naming a move; it is kept so those
    # answers have somewhere to go rather than being forced into a real one.
    version: "2026-09-29-move-v1"
    categories:
      - id: concede-and-narrow-argument
        name: "concede-and-narrow argument"
        gloss: >-
          Answers that first concede a point to an opposing view,
          then restrict its scope or force to make room for the
          author's own argument.
      - id: theory-synthesis-or-rebuttal
        name: "theory synthesis or rebuttal"
        gloss: >-
          Answers that survey, critique, or synthesize competing
          theoretical positions to clear ground for or to advance
          the author's own framework.
      - id: causal-process-tracing
        name: "causal process tracing"
        gloss: >-
          Answers that narrate a sequence of events or mechanisms,
          linking causes to outcomes through a detailed story of
          change.
      - id: comparative-case-analysis
        name: "comparative case analysis"
        gloss: >-
          Answers that contrast two or more cases (countries,
          periods, groups) to derive a generalizable pattern or to
          support a thesis.
      - id: bibliographic-or-evidentiary-apparatus
        name: "bibliographic or evidentiary apparatus"
        gloss: >-
          Answers that provide citations, source notes,
          references, or data documentation rather than making an
          analytical claim.
      - id: structural-or-typological-framework
        name: "structural or typological framework"
        gloss: >-
          Answers that lay out definitions, categories,
          typologies, or coding rules to structure subsequent
          analysis.
      - id: refutation-of-an-existing-claim-or-assumption
        name: "refutation of an existing claim or assumption"
        gloss: >-
          Answers that directly challenge a specific scholar's or
          school's claim, showing it to be empirically or
          logically flawed.
      - id: interpretation-or-reinterpretation-of-a-concept-or-text
        name: "interpretation or reinterpretation of a concept or text"
        gloss: >-
          Answers that reclassify, redefine, or reframe the
          meaning of an idea, event, figure, or text.
      - id: methodological-justification-or-critique
        name: "methodological justification or critique"
        gloss: >-
          Answers that defend or criticize a particular research
          method, data source, or analytical approach.
      - id: context-setting-or-historical-background
        name: "context-setting or historical background"
        gloss: >-
          Answers that establish the preconditions, scope, or
          contextual backdrop for the study's main argument
          without yet advancing it.
      - id: expose-of-hidden-mechanisms-or-unintended-consequences
        name: "exposé of hidden mechanisms or unintended consequences"
        gloss: >-
          Answers that reveal a non-obvious causal mechanism or
          ironic outcome, often showing how intentions misfire.
      - id: synthesis-of-findings-into-a-conclusion
        name: "synthesis of findings into a conclusion"
        gloss: >-
          Answers that wrap up or summarize a chapter's or book's
          argument, often by weaving previous evidence into a
          final claim.
      - id: role-annotation
        name: "role annotation (setup, evidence, etc.)"
        gloss: >-
          Answers that explicitly label their function in the
          text, such as 'role:evidence' or 'role:setup', without
          making a substantive claim.
