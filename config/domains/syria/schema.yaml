# Syria v0 domain schema (placeholder codebook).
#
# Transcribed from specs/PRODUCT.md Appendices A-G. This is the v0 placeholder
# schema referenced throughout the PRD ("specified in full in Appendices A-G");
# it is expected to be revised once the gold-set eval closes (PRD §11 step 7).
#
# Status flags on claim_type / theory_school tags follow the PRD legend:
#   firm       -- build as-is
#   tentative  -- likely to shift after the gold set
#   contested  -- the gold set must resolve this
#   candidate  -- provisional axis/tag, kept-or-cut by the eval
#
# Phase A v1 (issue #414, D4/D9; specs/PRODUCT.md Appendix G): this file is
# UNCHANGED ON DISK except for what D4/D9 struck outright (below) -- the
# retired off-list validator (`axial.tag`) enforced these closed lists;
# nothing does now. `axial.interrogate.frame_examples` reads them instead as
# D8 prompt EXAMPLES (never a menu, never validated against) for the
# `about`/`claim`/`ranges_over`/`position`/`move` free questions.
# `field` additionally stays live for `axial.gold`'s label-sheet
# stratification/dropdown (a surviving consumer independent of prose
# tagging, which is retired). Struck: `empirical_scope`'s `extra_fields`
# (the required `polity` field -- polities are names now, Appendix C) and
# the `polities_touched` facet (same reason). `theory_school`'s
# `not-applicable`/`unlisted` sentinels are struck for the interrogation
# pass per the spec but stay declared here -- see the note beside them --
# because the out-of-scope gold-set dropdown still reads them.
#
# `artifact_role` is struck outright (issue #429): the artifacts pass made
# no LLM call reproducibly (two independent runs disagreed on the role for
# 48.5% of artifacts and flipped the keep/discard bit on 13.1%), so the
# axis and the classification call are both gone. `retrievable` is now a
# rule over caption presence, decided in code (`axial.vault.
# build_artifact_frontmatter`), not a model judgment.

domain: syria
# 0.2 (issue #496): the interrogation frame splits `position_of` -- "whose
# position is this?" -- from the new `position`, "what is that position?".
# The old fused question answered "the author" for 76% of the corpus, so
# nothing downstream could read what the position actually was. This value
# lands in every answer record's `frame_version`, which makes a record
# self-identifying about which frame produced it. Consumers must still
# branch on KEY PRESENCE (`"position" in answers`), never on this string:
# another domain versions its own frame independently, and the corpus is a
# permanent mix of both shapes -- the 6,148 records written under 0.1 are
# not being re-interrogated.
version: 0.2

axes:
  # Appendix A -- Field axis.
  field:
    applies_to: [prose]
    cardinality: primary_plus_secondary
    values: [state, violence, ideology]

  # Appendix B -- Claim-type axis. ~23 tags; sub-tags refine, they do not
  # multiply the count.
  claim_type:
    applies_to: [prose]
    cardinality: primary_plus_optional_secondary
    values:
      # -- State domain --
      - id: state-formation
        status: firm
        subtags:
          - formation:bellicist
          - formation:colonial-import
          - formation:bottom-up
          - formation:post-conflict
      - id: state-capacity
        status: firm
        subtags:
          - capacity:infrastructural
          - capacity:despotic
          - capacity:extractive
          - capacity:coercive
      - id: state-autonomy
        status: firm
      - id: state-society-relations
        status: contested
      - id: legitimacy-and-legitimation
        status: firm
        subtags:
          - legitimacy:traditional
          - legitimacy:rational-legal
          - legitimacy:charismatic
          - legitimacy:juridical-vs-empirical
          - legitimacy:compliance-without-belief
      - id: sovereignty-and-recognition
        status: firm
      - id: statehood-gradations
        status: tentative

      # -- Violence domain --
      - id: violence-logic
        status: firm
        subtags:
          - violence:selective-vs-indiscriminate
          - violence:instrumental-vs-constitutive
      - id: violence-actors
        status: firm
      - id: civilian-targeting
        status: firm
      - id: mobilization-and-recruitment
        status: firm
      - id: war-and-state
        status: contested

      # -- Ideology domain --
      - id: nationalism-theory
        status: firm
        subtags:
          - nationalism:modernist
          - nationalism:ethno-symbolist
          - nationalism:practice-based
      - id: identity-and-group-formation
        status: contested
      - id: ideology-as-system
        status: firm
      - id: ideology-as-practice
        status: firm
      - id: legitimating-narratives
        status: contested
      - id: religion-and-politics
        status: tentative

      # -- Cross-cutting --
      - id: power-typology
        status: firm
      - id: revolution-and-contention
        status: firm
      - id: comparative-method
        status: firm
      - id: normative-political-theory
        status: tentative

  # Appendix C -- Empirical-scope axis.
  empirical_scope:
    applies_to: [prose]
    cardinality: single
    values:
      - scope:general
      - scope:comparative
      - scope:regional
      - scope:country-case
      - scope:sub-national

  # Appendix E -- Theory-school axis [CANDIDATE]. Grouped controlled
  # vocabulary preserved by group (State / Violence / Ideology) since the
  # groups are the load-bearing structure the eval watches for cross-field
  # recurrence; the loader flattens these into the axis's value count.
  theory_school:
    applies_to: [prose]
    cardinality: primary_plus_optional_secondary
    status: candidate
    groups:
      state:
        - colonial-postcolonial
        - marxist-political-economy
        - cultural-ideational
        - bellicist
        - neo-bellicist
        - external-statebuilding
        - neo-marxist
        - modernization-developmental
        - institutionalist-state-centered
        - structuralist
        - state-in-society
        - constructivist
      violence:
        - opportunity-feasibility
        - constructivist-anti-essentialist
        - biological-evolutionary
        - structural-violence
        - civilizing-decline
        - state-centered-organizational
        - micro-sociological
        - interpretive-constructivist
        - marxist-critical-pol-econ
        - postcolonial-decolonial
        - criminological
      ideology:
        - materialist
        - systematic
        - discursive
        - historical-sociological
        - subject-centered
      # `not-applicable`/`unlisted` are struck for the interrogation pass
      # (specs/PRODUCT.md Appendix E, D4/D9 -- D7's abstention and a
      # verbatim answer now do those two jobs) but stay declared here: the
      # gold-set Academic-labeling dropdown (`axial.gold._axis_vocabularies`,
      # out of this issue's scope, PRs #286/#287) still reads them off this
      # same shared file and its own locked test still requires them.
      none:
        - not-applicable
      open:
        - unlisted

  # Appendix D -- Artifact-role axis. STRUCK (issue #429): the artifacts
  # pass made no LLM call reproducibly, so both the axis and the
  # classification call are gone; see the note above `axes:`.

  # Appendix F -- Role-in-argument axis [FIRM].
  role_in_argument:
    applies_to: [prose]
    cardinality: single
    values:
      - role:setup
      - role:claim
      - role:evidence
      - role:counter-position
      - role:synthesis
      - role:methodological
      - role:digression

# Appendix G -- known-corpus reference for logging/aliasing in v0, not a
# validation gate; becomes enforced vocabulary at the post-eval schema
# revision (PRD §11 step 7).
polity_examples: [Syria, Turkey, Lebanon, Iraq, Rwanda]
