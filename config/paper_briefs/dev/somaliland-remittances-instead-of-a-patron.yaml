# Paper brief over the S-05 smoke analysis (specs/PHASE-C.md §7.1).
#
# Not Syria. S-05 asks two things at once: how non-recognition shaped
# Somaliland's state-building, and how secure the evidence for that account
# is. The record answers both and is blunt about the second -- it stands
# almost entirely on one comparative study that treats Somaliland as one case
# in ten. The paper has to carry that admission, not bury it in a confidence
# band.
