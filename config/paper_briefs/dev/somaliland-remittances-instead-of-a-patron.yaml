#
# No `title` key on purpose: the pipeline names the paper from the finished
# prose (§7.16).

thesis: >-
  Somaliland substituted diaspora remittances for a patron state and inter-clan
  consensus for imposed unity, and that substitution produced statehood that
  works relative to its collapsed parent while carrying its own structural
  strain: clan-skewed remittance flows, militarized spending, and democratic
  backsliding after 2006. The account rests on a thin evidential base, and
  saying so is part of the finding rather than a caveat attached to it.

