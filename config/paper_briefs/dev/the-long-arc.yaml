# All three sit on corpus pin sim-2026-07-26.

thesis: >-
  The institutions that decided who held power in Syria after 2011 were built
  under the mandate, not by the Baath and not by the war. What changed across a
  century was which group the arrangement favoured, and what stayed constant
  was that belonging, rather than office, was the thing being allocated.

