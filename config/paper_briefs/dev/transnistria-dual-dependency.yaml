thesis: >-
  Non-recognition built Transnistria through a dual dependency -- Russia for
  security, energy and credit, Moldova for customs and trade access -- that no
  other post-Soviet unrecognized state carries. That structure funded real
  institutions and a militarized hybrid regime at the same time, and it made
  the entity's domestic politics turn on business interests that pay the cost
  of isolation. What it does not explain is how the inflows were converted
  into working institutions.

