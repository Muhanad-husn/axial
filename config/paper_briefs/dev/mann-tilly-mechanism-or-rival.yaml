thesis: >-
  Mann's distinction between infrastructural and despotic power specifies
  Tilly's war-centred account of European nation-state formation rather than
  displacing it: war remains the driver, and the distinction explains why the
  same war pressure produced effective bureaucratic capacity in some states
  and hollow coercion in others. The specification fails where external rent
  substitutes for domestic extraction and severs the war-taxation-
  representation link the model runs on.

