thesis: >-
  Later accounts of sovereignty and statebuilding contest what Jackson's
  quasi-states were meant to explain rather than merely narrowing or extending
  the concept: Zaum contests the persistence of the negative-sovereignty
  regime, Caspersen contests the one-way direction of the juridical-empirical
  gap, and Ayubi contests the sufficiency of a normative-legal frame. The
  contestation is self-limiting, because each account argues in the vocabulary
  Jackson built.

