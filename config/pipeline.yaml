# Pipeline configuration: providers, model-per-pass, paths, batch sizes
# (PRD §6). Model-per-pass tuning was originally deferred (see
# plans/minimal-ingestion/04-structural-envelope.md, "out of scope"), with
# v0 giving every LLM-backed pass the same provider/model; DEC-26/issue #235
# landed the first per-pass override (`llm.model_by_pass` below), mirroring
# `reasoning_by_pass`'s own already-live per-pass mechanism. Every pass not
# named in `model_by_pass` still shares the one default provider/model
# configured here.
#
# The provider here is the default; it is overridden without editing this
# file by the AXIAL_LLM_PROVIDER environment variable (see src/axial/llm.py),
# which is how tests and CI select the no-network `stub`/`explode` seams.
#
# The OpenRouter API key and model name are NOT configured here (issue #23):
# they come from `[openrouter]` in secrets/secrets.toml (api_key, plus
# building_model/production_high/production_low selected by llm_tier), with
# the OPENROUTER_API_KEY environment variable as a fallback for the key only
# when secrets.toml is absent or lacks it. See secrets/secrets.example.toml.
llm:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  # Per-pass model reasoning (issue #207, PRD §7.9): a per-pass setting,
  # never hardcoded (src/axial/llm.py's OpenRouterClient reads this map via
  # _resolve_reasoning_by_pass, falling back to axial.llm.
  # DEFAULT_REASONING_BY_PASS when this block or the file is absent). ON for
  # the structural-envelope pass and the content-apparatus classification
  # gate (small, judgment-heavy, once/rarely-per-source calls); OFF
  # (unchanged since #147, which found reasoning blew the wall-clock on
  # large chunk-echo tag calls, now retired -- issue #414) for the
  # high-volume artifacts calls.
  reasoning_by_pass:
    envelope: true
    content_apparatus: true
    # Holdings-completeness check (§7.11, issue #284): one call per source,
    # same profile as the envelope. The acceptance bar is 0 false positives
    # over 30 sources, so precision is the whole point.
    holdings: true
    # Phase-B stage-4 synthesis (§7.11, issue #256): the judgment-heavy,
    # once-per-brief call every downstream validator checks. [TENTATIVE]
    # per §7.11 -- tuned on the first real briefs, not asserted here as final.
    # Founder-requested model-swap experiment (2026-07): an explicit "high"
    # effort level, not a bare `true` -- glm-5.2/deepseek-v4-pro/-flash only
    # support "high"/"xhigh" (no "medium"), so leaving it as a bool would
    # hand OpenRouter's implicit "medium" default to its own remap-to-nearest
    # instead of a deliberate choice (see src/axial/llm.py's
    # `_post_with_deadline`). "high" over "xhigh" ("max reasoning" per the
    # model cards) as the starting, unmeasured pick balancing quality against
    # latency/cost -- not yet tuned against real briefs, like every other
    # §7.11 tier/effort choice.
    synthesize: high
    # Brief-interrogation pre-pass (§7.2, issue #252): same experiment,
    # paired with routing this pass onto production_high below -- the
    # "does this premise's coverage-table row plausibly match" judgment call
    # that a 2026-07-23 sim-brief run showed the flash tier (reasoning off)
    # getting wrong (real "Syria" coverage misread as absent for a
    # "Syria, <date range>" case string).
    interrogate: high
    # Stage-3 agentic retrieval loop (§7.5/§7.6, issue #253): same
    # experiment; model stays production_low (deepseek-v4-flash, unchanged)
    # per the founder's request, reasoning turned on for the tool-selection
    # judgment calls within the loop.
    retrieve: high
    # Stage-4 counter-position GENERATION (§7.8/§7.11, issue #399): the
    # follow-up call `axial.analyze.synthesis.generate_counter_position`
    # makes only on a contested brief, drafting the §7.8 section from a
    # whitelisted pool of this run's own opposing evidence. Same
    # judgment-heavy, once-per-(contested)-brief profile as `synthesize`
    # above -- it IS the generating model's own continuation of that call,
    # just named separately (COUNTER_POSITION_GENERATE_PASS_NAME) so the
    # stub/record dispatch can tell the two calls apart.
    counter_position_generate: high
    # Phase A v1 per-note interrogation (§7.9/§7.15, issue #419): OFF, like
    # every other high-volume per-note pass (#147). The ~50-output sample
    # gate is where that default is tested -- if the sample shows the
    # answers need reasoning, turning it on is this line, not a code change.
    note_interrogate: false
    # Phase A v1 name-merge pass (§7.9/§7.16, issue #416): ON at an explicit
    # "high" effort, founder directive. Deciding which of a cluster's name
    # surface forms are the same thing is an underdetermined judgment call,
    # and reasoning at high IS the "think about it" mechanism -- which is why
    # the prompt itself stays loose and says nothing about thinking step by
    # step. Paired with temperature_by_pass.reconcile below.
    #
    # MEASURED 2026-07-28 against 200 already-decided real clusters: turning
    # this off runs 5.1x faster but agrees only 68% of the time, and the
    # disagreement is lopsided -- 55 clusters merged MORE against 7 less. It
    # fused two different works, an author with a co-authored byline, and a
    # word with a Latin phrase. Over-merging destroys information (D10: "two
    # genuinely different ideas must not [meet]"), so the speed is not for
    # sale. This line is what buys it. `low` is not an option: deepseek/glm
    # advertise only high/xhigh, and OpenRouter's remap-to-nearest measured
    # WORSE than high -- a higher median plus a 10,017-token blowup.
    reconcile: high
    # Phase A v1 Gather (§7.9/§7.18, issue #412): ON, as §7.9's pass table
    # states. Reading a page's worth of claims side by side and saying what
    # their authors disagree about is the same shape of judgment call as the
    # merge above -- underdetermined, low-volume relative to the per-note
    # pass, and won by letting the model think rather than by prompt
    # engineering. An explicit "high" rather than a bare `true` for the same
    # reason `reconcile` carries one: deepseek/glm advertise only high/xhigh,
    # so a bool hands the choice to OpenRouter's remap-to-nearest. The MODEL
    # is deliberately left to `llm_tier` -- unlike `reconcile`, no probe has
    # compared tiers on this call yet, and pinning one on no evidence would
    # read as a measured pick.
    gather: high
    # Phase A v1 grounding eval (issue #478, D15/D17): ON, same judgment
    # shape as `gather` above -- reading a disagreement against the passages
    # it was written from and deciding whether it holds up. Its own pass
    # name (not `gather`'s) so the model_by_pass entry below can route it to
    # a different model without moving Gather itself.
    gather_eval: high
    artifacts: false
    # Argument-map position extraction (issue #572): ON at an explicit
    # "high" effort, same profile as `reconcile`/`gather` above -- deciding
    # how many arguments a bag of similarly-worded passages actually holds,
    # and refusing to fuse contending ones into one sentence, is the same
    # underdetermined judgment call. Measured directly on the scratchpad
    # port this pass ships from: with reasoning off, a 200-passage bag
    # holding two opposed accounts of violence came back as one argument,
    # "violence is shaped by social, strategic and political processes";
    # with it on, the same bag correctly split into the two accounts.
    position_extract: high
    # Argument-map relate pass (issue #572, PR 2 of 4): ON, same profile as
    # `position_extract` above -- deciding how two positions actually
    # stand to one another, with no menu of relation types to pick from,
    # is the same underdetermined judgment call.
    position_relate: high
    # The door onto the argument map (issue #572, PR 3 of 4): ON at an
    # explicit "high" effort, same profile as `position_extract` above. One
    # call, no corpus in view, deciding what a question is actually about --
    # the same underdetermined judgment shape the port's own kickoff
    # measurement already found reasoning-off failing on a bag of similarly-
    # worded passages; this is the same kind of call made once per brief
    # instead of once per bag.
    brief_decompose: high
  # Per-pass SAMPLING TEMPERATURE (§7.9, issue #416): the third per-pass
  # block, same shape and same resolution as the two around it
  # (src/axial/llm.py's OpenRouterClient reads it via
  # _resolve_temperature_by_pass, falling back to axial.llm.
  # DEFAULT_TEMPERATURE_BY_PASS -- empty -- when this block or the file is
  # absent). Until this block existed no request carried a `temperature`
  # field at all, and a pass absent here still sends none, so every other
  # pass's sampling is exactly what it was.
  temperature_by_pass:
    # Founder directive, since MEASURED and vindicated (2026-07-28). Merging
    # names is an underdetermined generative judgment, and the project's own
    # measurement says that shape of task is won by sampling rather than by
    # prompt engineering (docs/tag-reliability-best-of-n.md §2.11, lesson 4).
    # Tested directly on a cluster that cost 13,845 completion tokens live:
    # temperature 0 was WORSE on every axis -- ~2x the tokens and ~5x the
    # latency (greedy decoding degenerates into repetitive reasoning loops;
    # sampling is what breaks the loop) -- and it was not even deterministic,
    # giving two distinct answers over five greedy draws. Nothing is bought by
    # turning this down. See data/logs/2026-07-28-names-merge-full/.
    reconcile: 1
  # NOTE on the three 2026-07 model-swap entries above and model_by_pass's
  # synthesize/interrogate below: this is a founder-directed provisional
  # pick to unblock real sim-brief runs, not a decided answer. The founder
  # has stated a formal per-pass model/reasoning eval -- covering more
  # combinations including frontier models, scored on output quality, cost,
  # latency, and whatever else matters per pass -- is planned once the app
  # is stable. Nothing here should be read as final until that eval lands.
  # Per-pass model tiering (DEC-26, issue #235): a per-pass MODEL override,
  # mirroring reasoning_by_pass's own per-pass shape (src/axial/llm.py's
  # OpenRouterClient reads this map via _resolve_model_by_pass, resolving
  # each named tier to a concrete model through the same secrets.toml
  # tier->model machinery llm_tier above uses). Absent from this map means
  # the pass keeps sending requests to the client's own default configured
  # model (llm_tier above) -- unchanged for every pass not named here. The
  # envelope pass's toc reconstruction is a once-per-source, judgment-heavy
  # call whose cost does not scale with corpus size, so it runs on the
  # stronger production_high tier (deepseek-v4-pro) -- the project's first
  # per-pass model override.
  model_by_pass:
    envelope: production_high
    # Phase-B stage-3 retrieval (§7.5/§7.6, issue #517): moved off the
    # default (production_low/flash) tier onto production_high on measured
    # evidence, not on a tier preference. Retrieval is a judgment call --
    # which two names to intersect -- and the flash tier could not make it.
    # Same brief (P3-01), same branch, same prompt, tier the only variable
    # (data/logs/2026-07-30-517-intersection-validation/): flash called
    # where_names_meet once, on a narrow name, and assembled 24 notes from
    # 2 sources; pro called it five times and assembled 137 notes from 12.
    # The signal was reaching flash either way -- find_names' member_count
    # and the per-result source span both sit in its prompt (ToolResult.
    # detail) -- and two prompt iterations did not change what it did with
    # them. ~5x the pass's cost and ~5 cents a brief, against 2 sources vs
    # 12 on a product whose premise is passages meeting across books.
    # ONE BRIEF, ONE DRAW: the five smoke briefs (issue #491) are what
    # turn this into a pattern, and they have not run yet.
    #
    # MOVED to its own tier 2026-07-31 (issue #493, founder direction). The
    # model is unchanged -- production_retrieve resolves to
    # deepseek/deepseek-v4-pro, exactly what production_high named -- but the
    # two-arm eval needs retrieval to move independently of the envelope
    # pass, which stays on production_high.
    retrieve: production_retrieve
    # Phase-B stage-4 synthesis (§7.11, issue #256): a dedicated tier,
    # mirroring envelope's own once-per-run, judgment-heavy profile but
    # NAMED SEPARATELY from production_high (2026-07 model-swap experiment)
    # so synthesis can move to a different model than envelope without
    # moving envelope too. Which concrete model backs production_synthesis
    # is out of this slice's scope, never hardcoded here -- see
    # secrets/secrets.toml.
    synthesize: production_synthesis
    # Brief-interrogation pre-pass (§7.2, issue #252): 2026-07 model-swap
    # experiment, moved off the default (production_low/flash) tier onto
    # production_high -- see the paired reasoning_by_pass.interrogate note
    # above for why.
    #
    # MOVED to its own tier 2026-07-31 (issue #493, founder direction), same
    # model as before (production_brief_interrogate resolves to
    # deepseek/deepseek-v4-pro). The brief pre-pass and the envelope pass
    # shared production_high, and the two-arm eval swaps one without the
    # other. Distinct from production_interrogate, which is Phase A's
    # per-NOTE pass.
    interrogate: production_brief_interrogate
    # Stage-4 counter-position generation (§7.8/§7.11, issue #399): routed
    # to the SAME tier as `synthesize` above, on purpose -- see that
    # pass name's own comment in reasoning_by_pass and in
    # src/axial/llm.py (COUNTER_POSITION_GENERATE_PASS_NAME) for why this
    # is still the generating model, never an independent judge.
    #
    # MOVED to its own tier 2026-07-31 (issue #493, founder direction). It
    # still resolves to the synthesis model in the open-source arm, so
    # nothing about "the generating model drafts its own counter-position"
    # changes by default; the closed-source arm is what needs the two split,
    # putting synthesis on one model and this pass on another.
    counter_position_generate: production_counter_position
    # Phase-C stage-3 drafting (specs/PHASE-C.md §7.12): its own tier, for the
    # same reason `synthesize` has one -- it is the judgment-heavy pass of its
    # layer, and it must be able to move without moving Phase B's synthesis
    # model, which is the standing smoke-v6 / eval-v2 baseline. Requires a
    # `production_paper_draft` key in secrets.toml; without one this pass
    # alone fails loudly (src/axial/llm.py, _resolve_model_by_pass), which is
    # the intended behaviour rather than a silent fallback to flash.
    #
    # NOT hardcoded to a concrete model here (DEC-26), and NOT assumed to be
    # the closed frontier tier: Phase B's two-arm eval had the all-open wiring
    # win at 2.3x less money on one draw, four models swapped at once, so
    # which model backs this tier is a measurement the first dev papers make,
    # not a preference this file settles.
    paper_draft: production_paper_draft
    # Phase-C stage-2 arc planning (§7.12). Founder direction 2026-08-01:
    # upgraded off the default flash tier to pro, before any measurement
    # rather than after one. The reasoning §7.12 carried -- "it emits
    # structure, not prose, so a cheaper tier may suffice" -- reads the pass
    # backwards. Deciding the arc IS the judgment: which claims earn a
    # section, what order makes each section earn the next, and where the
    # counter-position goes. The drafter only writes what this pass decided,
    # and `retrieve` already made this mistake once -- it sat on flash on the
    # same "it only picks" reasoning, and the tier turned out to decide
    # whether the run reached 2 sources or 12.
    #
    # Its own tier rather than a shared one, per the one-tier-per-pass rule
    # (#549), so planning and drafting can move independently.
    paper_plan: production_paper_plan
    # Phase A v1 per-note interrogation (§7.9/§7.15, D14, issue #419): its
    # own tier, resolving to z-ai/glm-5.2 in secrets.toml. Not
    # production_high (deepseek-v4-pro, the envelope pass) and not
    # production_synthesis (Phase B), so swapping this model never moves
    # either of those. An operator whose secrets.toml has no
    # production_interrogate key fails loudly on THIS pass alone, never on
    # the others (src/axial/llm.py, _resolve_model_by_pass).
    note_interrogate: production_interrogate
    # Phase A v1 name merge (§7.9/§7.16, issue #416). production_low
    # (deepseek-v4-flash) is a DELIBERATE pick on evidence, not the global
    # default leaking in: a 30-cluster probe over the real corpus
    # (2026-07-28) put flash at 1 clear error and 1 questionable canonical
    # in 30 decisions, and it got the hardest call in the sample right --
    # given `Aldous Huxley` / `Huxley` / `Thomas Huxley` it kept the two
    # people apart and folded only the ambiguous bare surname. Cost did not
    # decide this: a full pass is ~$0.55 on flash and only a few dollars on
    # any tier above it, so this is a quality call that flash won on its own
    # merits. Named here rather than left to `llm_tier` so the pass cannot
    # silently move the next time that default changes -- the same reason
    # every other entry in this block exists.
    reconcile: production_low
    # Phase A v1 grounding eval (issue #478, D15/D17, §10/charter §2 self-
    # grading guard): production_high (deepseek-v4-pro), the same tier the
    # envelope pass uses and NOT the tier Gather itself resolves to (Gather
    # carries no model_by_pass entry of its own, so it stays on whatever
    # `llm_tier` names) -- the pass that wrote a disagreement must never be
    # the pass that judges it grounded.
    gather_eval: production_high
  # Per-pass best-of-N voting (DEC-31, issue #294): how many times a pass
  # draws its per-unit call before majority-voting the result, mirroring the
  # two per-pass blocks above (src/axial/llm.py's _resolve_votes_by_pass
  # merges `llm.votes_by_pass` here over axial.llm.DEFAULT_VOTES_BY_PASS).
  # Absent from this map means one draw and no voting layer -- today's
  # behavior for every pass. The tag pass was the only entry here (DEC-31's
  # measured agreement-per-cost point, theory_school 0.757 -> 0.918,
  # claim_type 0.796 -> 0.866 at N=3) and is retired with it (issue #414,
  # D4: Phase A v1 is one draw, no voting layer). The mechanism itself
  # stays live for a future pass to configure here.

paths:
  envelopes_dir: data/envelopes
  vault_dir: data/vault

# Phase A v1 Reconcile: MERGE AGGRESSIVENESS (D10, §7.16, P0-12, issue #416).
# `axial names merge` re-clusters the persisted name vectors at this tightness
# and asks the model about one cluster at a time, so this is the dial D10's
# "start loose, tighten by inspection" is about -- the founder moves it after
# reading `axial names examine`'s tightness sweep, which reports at exactly
# these two HDBSCAN settings. It is deliberately NOT in the prompt: the prompt
# states the judgment and the model makes it; how much gets put in front of the
# model at once is this file's business. src/axial/merge_names.py reads it via
# _resolve_merge_tightness, falling back to axial.names' own
# DEFAULT_MIN_CLUSTER_SIZE / DEFAULT_MIN_SAMPLES when this block or a key is
# absent; `--min-cluster-size` / `--min-samples` on the CLI override it for one
# run. The seeded values are HDBSCAN's loosest, matching `axial names build`'s
# own defaults -- D10's starting point, never a tuned number.
names:
  merge_min_cluster_size: 2
  merge_min_samples: 1

# Phase A v1 Gather: MINIMUM MEMBER COUNT (§7.18, founder product-scope
# decision, 2026-07-29, not a tuned heuristic constant): a name below this
# member count is skipped before Gather assembles it into a packet -- no
# packet, no model call, counted as `names_skipped_below_min_members` in the
# run summary. src/axial/gather.py reads this via
# _resolve_min_gather_members, falling back to its own
# DEFAULT_MIN_GATHER_MEMBERS when this file or the key is absent. This is
# separate from gather.py's own `_MIN_MEMBERS = 2` (a disagreement needs two
# parties -- definitional, never moved into config); this is the movable
# scope cut, exposed here precisely so it stays visible and changeable
# without touching src/.
#
# Measured on a seeded 100-name stratified sample
# (data/logs/2026-07-29-gather-stratified-sample/summary.md): the value of
# asking is concentrated in large names -- 65% of the largest 20 names
# produced a real disagreement, ~22% of the upper decile (10-41 members),
# only 5-13% of a uniform-random name (median 3 members).
#
# And measured on the live index (20,321 eligible names, 118,963 member
# slots):
#
#   min members | names  | % of pool | member slots | batches
#   ----------- | ------ | --------- | ------------ | -------
#   2 (was default) | 20,321 | 100%  | 118,963      | 20,834
#   5           |  5,003 |  24.6%    |  80,935      |  5,516
#   10          |  1,927 |   9.5%    |  61,539      |  2,440
#   20          |    743 |   3.7%    |  45,932      |  1,256
#   50          |    221 |   1.1%    |  30,620      |    734
#
# Cutting at 10 drops 90% of the pages and keeps 52% of the member evidence
# -- the founder's chosen cut point.
gather:
  min_members: 10

# Stage-3 agentic retrieval loop (issue #253, PRD §7.5/§7.6, P0-3): a
# bounded step budget is a stated tunable, never hardcoded at the call
# site (src/axial/retrieve/loop.py reads this via _resolve_step_budget,
# falling back to its own DEFAULT_STEP_BUDGET when this file or key is
# absent, kept numerically in sync with this value -- see that constant's
# own comment).
#
# Cut 20 -> 14 by issue #545, from a replay of the same seven persisted
# smoke runs the smoke budgets above are set from (P3-04, S-01, S-02, S-03,
# S-04 on v2; S-05, S-03 on v3). For every run, the step at which the LAST
# note that ended up CITED first surfaced in that run's own trajectory:
#
#   brief   steps used   last cited note first surfaced at step
#   P3-04   20           13
#   S-01    16            7
#   S-02    20           12
#   S-03    11            8
#   S-04    17            2
#   S-05    20            3
#   S-03    20           10
#
# Maximum is 13, so steps 14-20 produced nothing any of the seven runs
# cited on the pre-#545 build. 14 is that ceiling plus one -- a
# PROVISIONAL headroom allowance, not a re-measured bound: the five hard
# briefs of #493 have never run at this budget, and issue #545's own
# metadata-in-feedback change (this same PR) is expected to move the
# settle-step down further on its own, since the loop can now tell a
# well-covered evidence set from a thin one without spending a re-query to
# find out. Re-cut from the post-#545 runs once they exist, the same
# "measured, not asserted" status the smoke budgets carry.
retrieve:
  step_budget: 14
  # Slice 02 (issue #254, PRD §4/§7.6): the re-query-on-thin threshold. A
  # tool result whose result_count is below this floor is fed back to the
  # model flagged as thin, so the agent can decide to broaden its query
  # (src/axial/retrieve/loop.py reads this via _resolve_thin_result_floor,
  # falling back to its own DEFAULT_THIN_RESULT_FLOOR when this file or key
  # is absent). 3 is a stated starting value, not yet measured against the
  # dev briefs -- tuning it is explicitly out of this slice's scope.
  thin_result_floor: 3

# Stage-4 synthesis prompt's evidence-text budget (issue #358): a real brief
# run against the real vault assembled enough chunk text that the synthesis
# prompt, combined with the fixed 60k-token completion budget sent on every
# call, pushed past the model's context window and OpenRouter rejected the
# request outright -- `retrieve.step_budget` above bounds the number of tool
# calls a retrieval run makes, not the number of chunks a single call can
# return. src/axial/analyze/synthesis.py reads this via
# _resolve_evidence_char_budget, falling back to its own
# DEFAULT_EVIDENCE_CHAR_BUDGET when this file or the key is absent.
# Character-based, not a real token count (~4 chars/token is a standard
# rough English-prose estimate).
#
# MEASURED against real brief runs (issue #572), which replaced the earlier
# [TENTATIVE] 100_000. That figure was sized as headroom under "a 128k-class
# context window"; every model this pipeline routes to now carries a 1M
# context, so the window was never the binding constraint -- the number was.
#
# What 100_000 actually did: it admitted ~20 notes, and since the assembled
# order is source round-robin (issue #517 slice 2), those 20 were 20 DISTINCT
# positions carrying ONE note each. An answer built from twenty single
# passages has no second witness for anything, which is what two sealed peer
# reviewers independently described as source facts with an inference welded
# on. Measured over a real evidence set: mean note 4,478 chars, median 4,212,
# p90 6,626, max 8,410 -- so 100_000 -> 20 notes, 200_000 -> 44, 250_000 ->
# 56, 400_000 -> 89.
#
# 250_000 is the first setting at which anything gets a second note: the
# ~44 landed and corridor positions each take one, then the strongest dozen
# take a second. Cost is real and linear -- roughly $0.15 of synthesis per
# brief against $0.13 at 200_000 -- and the per-chunk interrogation answers
# nearly double the payload, so 250_000 chars of evidence composes a ~485k
# char prompt. Raise this further only with the same measurement in hand.
synthesis:
  evidence_char_budget: 250000

# Contested detection has no numeric knob any more (issue #490, D3). The
# `contested_detection.min_distinct_theory_schools` block that lived here
# counted distinct `theory_school` primaries, an axis Phase A v1 deleted; the
# §7.8 rule now reads what the notes themselves say (`arguing_against` naming
# the other side, or a Gather disagreement at a name the answer rests on) and
# either fires or it doesn't.

# Google Drive connector tunables (issue #239, PRD §7.10 "Language-gate
# tunables" paragraph / §8 P0-11c): the English-only language gate's
# bounded text probe size and its accept-confidence threshold. src/axial/
# drive.py reads this block via _language_gate_config; an absent block/key
# falls back to that module's own DEFAULT_LANGUAGE_PROBE_CHARS /
# DEFAULT_LANGUAGE_ACCEPT_THRESHOLD.
drive:
  # Leading characters of a downloaded source's text layer fed to
  # langdetect -- large enough (a few hundred words) to classify reliably,
  # small enough to stay cheap per source.
  language_probe_chars: 4000
  # Minimum langdetect confidence (0-1) for the top-detected language to be
  # accepted as English. Set high on purpose: a false negative (a real
  # English source rejected) costs a manual re-check; a false positive
  # (non-English let through) pollutes the corpus and the eval.
  language_accept_threshold: 0.9

# Per-NAME coverage-band cut points (issues #260 and #490, PRD §7.7):
# src/axial/validators/coverage.py reads this via _resolve_coverage_bands,
# falling back to its own DEFAULT_MODERATE_FLOOR/DEFAULT_DENSE_FLOOR when
# this file or either key is absent. `thin` is corpus_note_count below
# moderate_floor, `moderate` is [moderate_floor, dense_floor), `dense` is
# dense_floor and above.
#
# Proven by inspection against the real corpus (2026-07-30,
# data/logs/2026-07-30-slice-05-coverage/): over the 30 real brief-shaped
# names that resolve against the live index these cut points split 15 thin /
# 9 moderate / 6 dense, from `bare life` (1 note) through `state of
# exception` (27) to `Syria` (962). Unchanged from #260's starting
# hypothesis because the measurement supports them.
coverage_bands:
  moderate_floor: 20
  dense_floor: 100

# The smoke set's per-brief cost and latency budgets (specs/PHASE-B.md §9.0,
# issue #491): `axial brief smoke` compares each brief's run-report figures
# against these, so a spend or slowdown regression shows the day it lands.
#
# Re-cut 2026-07-31 from the smoke-v4 run: all six briefs, one draw each, on
# the post-#541/#542/#545 build (`data/logs/2026-07-31-smoke-v4/`). They remain
# CEILINGS that should never fire, not tight budgets. The figures they replace
# came from seven runs of five briefs on a build that has since lost ~600s of
# non-model work per brief, so every one of them was stale.
#
#   cost     $0.0618 - $0.2278 over the six, mean $0.1253. The ceiling is 1.3x
#            the highest. The previous $0.25 was left BELOW the observed range's
#            top after the re-measure -- S-02 came in at $0.2278, 91% of it, so
#            the gate was one ordinary run from crying wolf.
#   latency  291.8s - 688.3s (sweep wall clock). The ceiling is 1.3x the
#            highest, down from 1800s, which the fastest brief now beats 6x.
#
# The headroom is 1.3x on both because run-to-run variance on this set is real
# and measured, not assumed: S-03 moved 39% between two runs of the same brief
# on the same code. One draw per brief cannot see that spread, so neither figure
# is cut to the observed maximum.
#
# src/axial/brief/smoke.py reads this via `resolve_budgets`, and there is NO
# code-level fallback on purpose: an unset budget SKIPS its check and prints
# UNMEASURED, so it can neither pass vacuously nor fail for a number nobody
# measured.
smoke:
  max_usd_per_brief: 0.30
  max_seconds_per_brief: 900

# Rung-3 eval-gate thresholds (issues #262, #264, PRD §10, §8 P0-12): one
# starting threshold per named metric, read by src/axial/gates/harness.py via
# resolve_threshold, falling back to that module's own
# DEFAULT_GATE_THRESHOLDS when this file or a key is absent. The FIRM
# principle behind each gate (attribution fidelity, grounding, adversarial
# red-teaming) is fixed; these numbers are §10's stated TUNABLE starting
# hypotheses, never proven values -- tuning them on real runs is explicitly
# out of scope for the issue that landed each gate.
gates:
  # Attribution fidelity (charter Principle II): the hard, 100% mechanical
  # gate -- one unmarked or unresolvable-grounds claim fails it outright.
  attribution_completeness: 1.00
  # Attribution fidelity's judged half: the share of kind-"b" claims an
  # independent model finds phrased as a source assertion rather than the
  # tool's own cross-source inference.
  b_seam_mislabel_rate: 0.05
  # Grounding (charter Principle I): the share of kind-"a" claims whose cited
  # grounds substantively support the claim, judged by an independent model
  # anchored to the resolved chunk text.
  grounding_support_rate: 0.90
  # Synthesis quality (issue #263, charter Principle IV): the share of the
  # contested-brief subset that is present-or-disclosed (§7.8).
  counter_position_presence_rate: 0.95
  # Synthesis quality's judged half: the share of present counter-positions
  # that verdict "steelman" (not "strawman") against the cited grounds --
  # this slice's operationalization of "the eval #1 rubric bar" (§10),
  # since the rubric itself is not authored yet. No spec-stated number; 0.90
  # is a starting hypothesis, tuned once the rubric lands.
  steelman_quality: 0.90
  # Calibration (issue #263, charter Principle V, §7.4): how far an
  # observed band's judged-correctness rate may sit from that band's stated
  # target rate (src/axial/gates/calibration.py) -- band-wise, not ECE/Brier
  # (§10 v1.1, founder-adjudicated).
  band_reliability: 0.15
  # Adversarial-brief red-teaming (charter Principle III, issue #264): the
  # share of a seeded set of adversarial briefs on which the interrogation
  # pre-pass named the smuggled premise.
  premise_catch_rate: 0.80

# Calibration gate band targets (issue #263, PRD §7.4 [TENTATIVE]): the
# stated expected-correctness rate per confidence band, read by
# src/axial/gates/calibration.py via _resolve_band_targets, falling back to
# that module's own DEFAULT_BAND_TARGETS when this file or a key is absent.
# `medium` is the midpoint of §7.4's stated 0.60-0.85 range. Tuning these on
# the first judged runs is explicitly out of this issue's scope.
calibration:
  band_targets:
    high: 0.85
    medium: 0.725
    low: 0.60
  # The minimum judged-claim count a band needs before its observed rate
  # feeds `band_reliability` at all (issue #402, PRD §7.4's own
  # stated-TENTATIVE minimum sample size, first set here by the 2026-07-25
  # benchmark evidence: a single high-band claim was generating a verdict
  # with two of three bands empty). 5 is the standard rule-of-thumb minimum
  # cell count from categorical statistics -- the same "expected count >= 5"
  # bar a chi-square test applies -- not a number tuned to this run's own
  # pass/fail counts. src/axial/gates/calibration.py reads this via
  # _resolve_min_band_n, falling back to its own DEFAULT_MIN_BAND_N when
  # this file or the key is absent.
  min_band_n: 5
