case: "De facto states and the recognition regime, 1945-2020"
request: "Two anomalies stand on opposite sides of the same line. Recognized states have survived for decades with almost no capacity to govern the territory their sovereignty names, and unrecognized states — Somaliland, Abkhazia, Transnistria, Northern Cyprus, Kosovo before 2008 — have taxed, conscripted, policed and schooled populations for as long without ever obtaining the title. Decide what a nation-state is such that both facts follow: a status conferred from outside, an organizational capacity built from inside, or an ideological project that needs neither. State the strongest version of the account you reject. Then test your choice on survival: explain why quasi-states are not eliminated by their stronger neighbours and why de facto states are not absorbed, and say which observation would have told against you."
lens: "sovereignty as status versus sovereignty as capacity"
