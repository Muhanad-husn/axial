[project]
name = "axial"
version = "1.0.0"
description = "Axial: corpus ingestion pipeline turning academic sources into a tagged Obsidian knowledge graph. Built by a one-person agentic engineering org."
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langdetect>=1.0.9",
    "openpyxl>=3.1.5",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
axial = "axial.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axial"]

# Issue #772: the shipping service image (Dockerfile, `uv sync --no-default-
# groups --group service`) has no reason to carry the ingest/extract stack --
# that runs locally from the repo, against `data/sources/`, never inside the
# service. CPU-only torch resolution, Linux only: the founder's own Windows
# install already resolves a CPU-only wheel from PyPI directly and must keep
# doing so; only the Linux (container) resolution needs redirecting away from
# PyPI's CUDA-bundled default wheel.
[tool.uv]
default-groups = ["dev", "ingest"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
# torchvision travels with torch or not at all: it links against torch's own
# libraries, so a PyPI (CUDA-built) torchvision against a `+cpu` torch fails
# to import. Measured in CI: pinning torch alone moved Linux to
# torch 2.13.0+cpu and torchvision 0.28.0 (PyPI), which broke
# `transformers`' lazy `AutoProcessor` import, so docling fell back to
# unstructured and extraction stopped finding tables at all.
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[dependency-groups]
dev = [
    "filelock>=3",
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.6",
]
# The ingest/extract stack (issue #772, split out of `dependencies`): docling
# and unstructured convert a raw source into a structural tree, and the two
# Google packages drive the Drive doorway (`axial.drive`) -- all of it runs
# locally, from the repo, against `data/sources/`, and none of it is ever
# imported by the served ask path (`axial.service.api`/`.worker`). A
# `default-groups` member (`[tool.uv]` above), so a bare `uv sync` and CI
# still install it exactly as before; the Dockerfile is the one caller that
# opts out (`--no-default-groups --group service`).
ingest = [
    "docling>=2.110.0",
    # Listed here only so `[tool.uv.sources]` above can redirect it -- uv
    # applies a source override to direct requirements only, the same reason
    # `torch` is named in `service`. docling and unstructured are its real
    # callers; the service image never installs this group and so never
    # carries torchvision at all.
    "torchvision",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.30.0",
    "unstructured-inference>=1.6.13",
    "unstructured[pdf]>=0.24.0",
]
# Stage-5 distillation runtime deps (DEC-35, issue #296): a local
# sentence-transformer for the embedding pass + LanceDB for the vector
# store. Neither belongs in `dependencies` (not needed by the Phase A
# pipeline) nor `dev` (not CI tooling) -- its own group, installed via
# `uv sync --group distill`. scikit-learn + hdbscan added in #297 (stage
# 5b: PCA reduction + HDBSCAN clustering for the readiness map) --
# `umap-learn` deliberately NOT added: DEC-35 named it for notebook-only
# visualization, but #297 builds no notebook, so it would be an unused
# dependency.
# Mechanical name-merge experiment (PR #441 follow-up): model-free entity
# resolution over the recorded merge decisions. Not needed by any pipeline
# pass -- installed via `uv sync --group experiment`.
experiment = [
    "jellyfish>=1.2",
    "rapidfuzz>=3.14",
    "unidecode>=1.4",
]

distill = [
    "hdbscan>=0.8.38",
    "lancedb>=0.15",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
]

# The analyst service layer (issues #681, #682): a Postgres driver, the HTTP
# framework and the ASGI server that only the service and its tests need,
# never the Phase A/B/C pipeline -- same rationale as `distill`/`experiment`
# above. `uv sync --group service`. `uvicorn` is how the app is served at all
# (`uvicorn axial.service.api:app --factory`); #691's deployment runs it.
service = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.32",
    # `GET /asks/{id}/export?format=odt` (issue #724): pure Python, no
    # binary -- `python-docx` (already a main dependency) covers `docx`
    # the same way; together they keep every export format's conversion
    # off a pandoc binary #691's image would otherwise have to carry.
    "odfpy>=1.4.1",
    # `current_principal` (issue #763): verifies a Supabase-issued JWT
    # against its JWKS. `PyJWKClient` handles the JWKS fetch, `kid` lookup
    # and caching; `jwt.decode` checks the signature, `exp`, `iss` and
    # `aud` -- no hand-rolled JOSE parsing.
    "pyjwt[crypto]>=2.9",
    # `axial.query.names.find_names`' tier-4 semantic fallback (§7.4): reads
    # the persisted name-embedding table (`lancedb`) and encodes the query
    # surface against it (`sentence-transformers`) -- a real ask-path read,
    # reached whenever a retrieval loop's exact/fuzzy tiers miss, not a
    # distillation-only step. Discovered missing (issue #691's own live
    # `docker compose up` run: an ask failed `No module named 'lancedb'`
    # mid-retrieval). Pinned to the same versions `distill` already
    # declares below for the SAME two packages, since both groups need the
    # identical read/encode behaviour to agree; `distill`'s `hdbscan`/
    # `scikit-learn` stay out of this image -- those build the embeddings
    # offline and are never reached by a served ask.
    "lancedb>=0.15",
    "sentence-transformers>=3.0",
    # `sentence-transformers`' own torch dependency, pinned here (not just
    # via `[tool.uv.sources]` alone) because `uv` only applies a source
    # override to a package that is a DIRECT requirement somewhere in the
    # project -- measured: without this line, `torch` stayed on PyPI's
    # default (CUDA-bundled) build even with the override declared. No
    # version floor beyond what `sentence-transformers` already needs.
    "torch",
]
# The local operator console (issue #689): Streamlit, and nothing else. It is
# a face on the `axial` CLI for one operator on one machine -- no pipeline pass
# imports it and the #691 service worker image must not carry it, so it gets
# its own group rather than `dependencies`. `uv sync --group operator`, then
# `axial console`. >=1.45 is where `st.context.theme` (what the browser asked
# for, which the console's "System" theme setting reads) landed.
operator = [
    "streamlit>=1.45",
]

# tests/ holds only outer acceptance contracts (test-author, locked once red);
# inner unit tests are co-located under src/ (implementer's domain) - DEC-20.
#
# A bare `pytest` is the pre-commit suite, and only that: the src/ units, in
# parallel, without the real-docling tests. It used to mean the whole tree run
# serially, which takes ~55 minutes and is nobody's pre-commit check. CI still
# runs tests/ -- it names its paths explicitly, so testpaths never applies
# there -- and remains the only place the acceptance contracts run.
#
# The xdist default is why the acceptance job passes `-n 0`: those contracts
# drive the CLI through subprocesses that share the real data/envelopes and
# data/vault scratch dirs, so parallel workers on one filesystem clobber each
# other. See the note above the `acceptance` job in .github/workflows/ci.yml.
[tool.pytest.ini_options]
testpaths = ["src"]
addopts = "-q -m 'not slow' -n auto"
markers = [
    "slow: exercises the real docling conversion pipeline (model load, no network once cached)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Scripts under data/ are archived run artefacts, not project source. Linting
# them would mean editing the exact code a recorded measurement ran (DEC-66).
extend-exclude = ["data"]
