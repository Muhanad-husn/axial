# CI for this repo (tdd-ci deliverable): runs the full suite - outer acceptance
# contracts in tests/ plus inner unit tests under src/ - and lint, on PRs into
# main and on main itself. No secrets are read or committed; if a job ever needs
# credentials, inject them via repo Actions secrets.
#
# `push` is scoped to main. Unscoped, it fired on every feature-branch push and
# the `pull_request` event fired again on the same commit, so every PR push paid
# for two identical ~6-minute runs.
#
# `paths-ignore` skips the suite when a change touches nothing but prose. It
# applies only when EVERY changed file matches, so a PR mixing docs and code
# still runs. Branch protection declares no required status checks, so a skipped
# run cannot leave a PR blocked on a check that never reports. The filter is by
# extension rather than by directory on purpose: `docs/` also holds real Python
# (`docs/postmortem/gold-run-2026-07/parse_run.py` and `waste_breakdown.py`), and
# `ruff check .` lints it.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.rst'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.rst'

# A second push to the same PR cancels the first PR's in-flight run. Nothing
# reads a superseded run's result, and the runs are the expensive part.
# main is deliberately excluded: every commit on main gets its own full run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The hermetic src/ unit tests parallelize cleanly across cores (pytest-xdist)
  # and finish in ~20s, so they share a job with lint, which is instant.
  unit:
    name: unit + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # docling downloads its layout + TableFormer weights from the Hugging Face
      # Hub on first conversion (docling-project/docling-layout-heron and
      # docling-project/docling-models). Cache them across runs so only the very
      # first run pays the download; OCR is disabled in extract.py, so no
      # modelscope/RapidOCR weights are ever fetched. The same cache also
      # covers the stage-5 embedding pass's sentence-transformer checkpoint
      # (sentence-transformers/all-MiniLM-L6-v2, issue #296) -- both live
      # under ~/.cache/huggingface, so no separate cache step is needed.
      - name: Cache docling model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ hashFiles('uv.lock') }}
          restore-keys: |
            hf-cache-

      # `distill` (issue #296, DEC-35: sentence-transformers + lancedb) is an
      # optional dependency group, not part of the default `dependencies`/`dev`
      # groups -- synced explicitly so the stage-5 embedding-pass tests
      # (src/axial/distill/, tests/distill/) run for real instead of skipping.
      - name: Install dependencies
        run: uv sync --group distill

      # The one real-docling end-to-end unit test is marked `slow`; it is
      # deselected because the outer acceptance test (tests/test_extract.py)
      # already exercises the real docling path end-to-end via the CLI.
      - name: Run unit tests (parallel)
        run: uv run pytest src -q -m "not slow" -n auto

      - name: Lint
        run: uv run ruff check .

  # The tests/ acceptance contracts drive the CLI through subprocesses that share
  # the real data/envelopes and data/vault scratch dirs, so they cannot run under
  # pytest-xdist -- parallel workers on one filesystem clobber each other's
  # envelope/vault state. Sharding across JOBS sidesteps that: each shard is its
  # own runner with its own filesystem, so the contracts still run serially
  # within a shard while the shards run concurrently. Wall clock becomes the
  # slowest shard rather than the sum. No test changes and no conftest changes.
  #
  # The `rest` shard is defined by exclusion, not by an explicit path list, so a
  # newly added tests/<dir> is picked up automatically instead of silently never
  # running. Keep it that way: any new named shard must also be added to `rest`'s
  # --ignore list, and nothing else needs touching.
  acceptance:
    name: acceptance (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # One shard failing must not cancel the others -- a red PR should report
      # every failure it has, not just the first shard to trip.
      fail-fast: false
      matrix:
        include:
          - name: ingestion
            paths: tests/ingestion
          - name: analysis
            paths: tests/analysis
          - name: rest
            paths: tests --ignore=tests/ingestion --ignore=tests/analysis
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache docling model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ hashFiles('uv.lock') }}
          restore-keys: |
            hf-cache-

      - name: Install dependencies
        run: uv sync --group distill

      - name: Run acceptance tests (serial within the shard)
        run: uv run pytest ${{ matrix.paths }} -q -m "not slow" --durations=15
