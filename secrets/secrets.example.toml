# Copy to secrets/secrets.toml (gitignored) and fill in real values.
# Never commit the real file.

[openrouter]
api_key = "sk-or-..."
# Model tiering (issue #23): llm_tier selects which of the three model
# keys below get_client() sends requests with. Defaults to "building"
# when unset.
llm_tier = "building"
building_model = "nvidia/nemotron-3-ultra-550b-a55b:free"
production_high = "deepseek/deepseek-v4-pro"
production_low = "deepseek/deepseek-v4-flash"
# Phase A v1 (D14, issue #419): the per-note interrogation pass's own tier.
# Named separately from production_high/production_synthesis for the same
# reason production_synthesis was: config/pipeline.yaml routes
# note_interrogate here, so this pass's model can be swapped without moving
# the envelope pass (production_high) or Phase B synthesis
# (production_synthesis) with it. glm-5.2 was high-variance on the
# book-level envelope pass (DEC-27/28), which is why the run samples ~50
# outputs before paying for the corpus.
production_interrogate = "z-ai/glm-5.2"
# Phase B's four model-calling passes, one tier each (issue #493, founder
# direction 2026-07-31). config/pipeline.yaml routes brief interrogation,
# retrieval, synthesis and counter-position generation here, so the eval's
# open-source and closed-source arms are a swap of these four values and
# nothing else. Every Phase A tier above is untouched by that swap, which is
# the whole point of splitting them.
#
# Open-source arm:   brief_interrogate = z-ai/glm-5.2
#                    retrieve          = deepseek/deepseek-v4-pro
#                    synthesis         = moonshotai/kimi-k3
#                    counter_position  = moonshotai/kimi-k3
# Closed-source arm: brief_interrogate = openai/gpt-5.4
#                    retrieve          = openai/gpt-5.4
#                    synthesis         = openai/gpt-5.6-sol
#                    counter_position  = openai/gpt-5.4
#
# A tier named in pipeline.yaml but missing here is a hard error on that
# pass, never a silent fall back to a cheaper model.
production_brief_interrogate = "deepseek/deepseek-v4-pro"
production_retrieve = "deepseek/deepseek-v4-pro"
# Was documented in the comment above but never declared here, so an operator
# setting up from this template hit a hard error on the synthesis pass rather
# than a missing-value warning. Added 2026-08-01.
production_synthesis = "z-ai/glm-5.2"
production_counter_position = "z-ai/glm-5.2"
# Phase C's two model-calling passes, one tier each, same rule as Phase B's
# four above (specs/PHASE-C.md §7.12). Planning runs on the pro tier rather
# than flash on founder direction 2026-08-01: deciding the arc is the
# judgment, and the drafter only writes what the plan already decided.
# Drafting starts matched to production_synthesis because turning evidence
# into argued prose is the job synthesis already does -- a starting position,
# not a measurement. Nothing has measured drafting itself yet.
production_paper_plan = "deepseek/deepseek-v4-pro"
production_paper_draft = "z-ai/glm-5.2"
# Issue #116: when a completion's finish_reason is "content_filter" (a
# moderation refusal), it is rerouted -- once, never blind-retried against
# the same model -- to this model instead. Optional; absent means no
# fallback (a refusal raises ContentRefusedError directly). Choose a model
# that does not moderate scholarly descriptions of violence, since this
# corpus's source material routinely discusses war, atrocity, and conflict
# in an academic register that some providers' default moderation flags.
# content_fallback_model = "some/unmoderated-model"

[nvidia]
api_key = "nvapi-..."

[drive]
# Google Drive source connector (issue #237, specs/PRODUCT.md Sec. 7.10 /
# P0-11): a service account's JSON key path and the shared "Books" folder's
# Drive id. Missing or incomplete values halt `axial drive ingest` with a
# clear logged error before any network call.
service_account_json = "secrets/gdrive-service-account.json"
books_folder_id = "your-drive-folder-id"
